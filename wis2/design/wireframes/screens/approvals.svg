<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>
    .t { font: 16px Inter, system-ui, -apple-system, "Segoe UI", Roboto; fill: #111827 }
    .muted { fill: #6B7280 }
    .btn { fill: #16A34A }
    .btn2 { fill: #DC2626 }
  </style>
  <rect x="0" y="0" width="1440" height="900" fill="#ffffff"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="1440" height="56" fill="#111827"/>
  <text x="24" y="36" class="t" fill="#fff">WIS2</text>
  <!-- Sidebar -->
  <rect x="0" y="56" width="240" height="844" fill="#F9FAFB"/>
  <text x="24" y="96" class="t">Dashboard</text>
  <text x="24" y="128" class="t">Courses</text>
  <text x="24" y="160" class="t">My Schedule</text>
  <text x="24" y="192" class="t">Approvals</text>
  <text x="24" y="224" class="t">Grading</text>
  <!-- Content -->
  <text x="280" y="96" class="t">Approvals</text>
  <!-- Table header -->
  <rect x="280" y="128" width="880" height="40" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="300" y="154" class="muted">Student</text>
  <text x="520" y="154" class="muted">Kurz</text>
  <text x="720" y="154" class="muted">Stav</text>
  <text x="840" y="154" class="muted">Akce</text>
  <!-- Row -->
  <rect x="280" y="168" width="880" height="48" fill="#fff" stroke="#E5E7EB"/>
  <rect x="1040" y="178" width="56" height="28" rx="6" ry="6" class="btn"/>
  <text x="1052" y="198" class="t" fill="#fff">OK</text>
  <rect x="1104" y="178" width="56" height="28" rx="6" ry="6" class="btn2"/>
  <text x="1117" y="198" class="t" fill="#fff">No</text>
</svg>