  <!-- Rows -->
  <rect x="280" y="224" width="880" height="48" fill="#fff" stroke="#E5E7EB"/>
  <rect x="280" y="272" width="880" height="48" fill="#fff" stroke="#E5E7EB"/>
  <rect x="280" y="320" width="880" height="48" fill="#fff" stroke="#E5E7EB"/>
</svg>